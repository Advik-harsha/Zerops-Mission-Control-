zerops:
  # ────────────────────────────────────────────────────
  # API — Python 3.11 FastAPI service
  # ────────────────────────────────────────────────────
  - setup: api
    build:
      base: python@3.11
      addToRunPrepare:
        - ./api/requirements.txt
      deployFiles:
        - ./api/~
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      prepareCommands:
        - python3 -m pip install --break-system-packages -r $(find /home/zerops -name requirements.txt | head -n 1)
      start: python3 -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
      readinessCheck:
        httpGet:
          port: 8000
          path: /health

  # ────────────────────────────────────────────────────
  # GUI — React + Vite static site
  # ────────────────────────────────────────────────────
  - setup: gui
    build:
      base: nodejs@22
      buildCommands:
        - cd gui && npm install && npm run build
      deployFiles:
        - ./gui/dist/~
    run:
      base: static
