zerops:
  # ────────────────────────────────────────────────────
  # API — Python 3.11 FastAPI service
  # ────────────────────────────────────────────────────
  - setup: api
    build:
      base: python@3.11
      buildCommands:
        - cd api && pip install -r requirements.txt
      deployFiles:
        - ./api
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      start: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
      readinessCheck:
        httpGet:
          port: 8000
          path: /health
          scheme: http
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 6

  # ────────────────────────────────────────────────────
  # GUI — React + Vite static site
  # ────────────────────────────────────────────────────
  - setup: gui
    build:
      base: nodejs@22
      buildCommands:
        - cd gui && npm install && npm run build
      deployFiles:
        - ./gui/dist/~
    run:
      base: static
